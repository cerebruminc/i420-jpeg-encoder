on:
  push:
    branches:
      - master
  workflow_dispatch:

name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      CEREBRUM_NPM_TOKEN: ${{ secrets.CEREBRUM_NPM_TOKEN }}
    steps:
      - uses: cerebruminc/ci-actions/cerebruminc/release-please@v1
        id: release
        with:
          release-type: node
          token: ${{ secrets.GHA_NODEJS_TOKEN }}
      # The logic below handles the npm publication:
      - uses: cerebruminc/ci-actions/actions/checkout@v1
        # these if statements ensure that a publication only occurs when
        # a new release is created:
        if: ${{ steps.release.outputs.release_created }}
      - uses: cerebruminc/ci-actions/actions/setup-node@v1
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.release_created }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libturbojpeg0-dev pkg-config
        if: ${{ steps.release.outputs.release_created }}
      - run: npm i
        if: ${{ steps.release.outputs.release_created }}
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.CEREBRUM_PUBLISH_NPM_TOKEN}}
        if: ${{ steps.release.outputs.release_created }}
